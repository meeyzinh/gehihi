<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Bảng Điều Khiển Xiaozhi</title>
  <link rel="icon" href="/favicon.ico">
  <script>
    window.__STATIC_WEB_BASE__ = location.protocol === 'file:' ? './' : '/';
    // Sử dụng phiên bản tĩnh để tránh bộ nhớ cache trình duyệt
    window.__STATIC_WEB_VERSION__ = '20261027-vi-vn-render';
    document.write('<link rel="stylesheet" href="' + window.__STATIC_WEB_BASE__ + 'assets/app.css?v=' + window.__STATIC_WEB_VERSION__ + '">');
  </script>
</head>
<body>
  <div id="app">
    <div class="app-loading">
      <div class="loading-mark"></div>
      <div>Đang tải bảng điều khiển...</div>
    </div>
  </div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script>
    document.write('<script src="' + window.__STATIC_WEB_BASE__ + 'assets/app.js?v=' + window.__STATIC_WEB_VERSION__ + '"><\/script>');
  </script>
</body>
</html>
